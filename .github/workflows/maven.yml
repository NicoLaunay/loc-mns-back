# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

# Conditions d'exécution :
on:
  push:
    # concernant les branches :
    branches: [ "main" ]
  pull_request:
    # concernant les branches :
    branches: [ "main" ]

jobs:
  build:
  
    # Système du conteneur build :
    runs-on: ubuntu-latest

    # Actions à réaliser :
    steps:
    # Checkout effectue un clone du projet pour le mettre sur l'environnement de build (vide) :
    - uses: actions/checkout@v4
    # Mise en place d'un JDK :
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Ligne ajoutée
    - name: rename .example.env to .env
      run: mv .example.env .env

    # Ecrase le DB_HOST du .env dans application.properties
    - name: change localhost to db service name (postgres) in application.properties
      run: sed -i 's/ ${DB_HOST} /postgres/' src/main/resources/application.properties

    #    - name: Idem mais en modifiant le .env
    #      run: |
    #        sed -i 's/^DB_HOST=.*/DB_HOST=postgres' .env

    # Lancement de la commande Maven :
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Construction de l'image docker (ici via docker hub) nom:tag
    - name: Build docker image
      run: docker build -t nicol49/test-devops-locnes-back .

    # Récupération du tag stocké dans le pom.xml → stocké dans la variable VERSION
    - name: Extract project version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
    # Tag de l'image
    - name: Tag image with version from pom.xml
      run: docker tag nicol49/test-devops-locnes-back nicol49/test-devops-locnes-back:${{ env.VERSION }}

    # Connection à Docker hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: nicol49
        password: ${{ secrets.DOCKER_PASSWORD }}

    # On pousse l'image vers docker hub (en tant que latest version)
    - name: Push docker image
      run: docker push nicol49/test-devops-locnes-back
    # On pousse l'image versionnée vers docker hub (pour l'historique des versions)
    - name: Push docker image with version
      run: docker push nicol49/test-devops-locnes-back:${{ env.VERSION }}
